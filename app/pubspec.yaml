name: allpics
description: "AllPics — Every Photo. One Album. Shared event albums via one QR code."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^16.3.0

  # Backend
  supabase_flutter: ^2.10.4

  # UI
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  video_player: ^2.10.0

  # Platform integrations
  share_plus: ^12.0.0
  image_picker: ^1.2.0
  cross_file: ^0.3.4
  razorpay_flutter: ^1.4.0

  # Networking + storage
  http: ^1.6.0
  shared_preferences: ^2.5.0

  # Utilities
  intl: any
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
