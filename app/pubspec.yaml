name: allpics
description: "AllPics — Every Photo. One Album. Shared event albums via one QR code."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^16.3.0

  # Backend
  supabase_flutter: ^2.10.4

  # UI
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  video_player: ^2.10.0

  # Platform integrations
  camera: ^0.11.4
  share_plus: ^12.0.0
  image_picker: ^1.2.0
  cross_file: ^0.3.4
  razorpay_flutter: ^1.4.0

  # Networking + storage
  http: ^1.6.0
  shared_preferences: ^2.5.0

  # Utilities
  intl: any
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Regenerate after replacing assets/branding/app_icon.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: assets/branding/app_icon.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    theme_color: "#6C5CE7"
    background_color: "#6C5CE7"

# Regenerate after replacing assets/branding/splash_logo.png:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#6C5CE7"
  color_dark: "#0E0D12"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#6C5CE7"
    color_dark: "#0E0D12"
    image: assets/branding/splash_logo.png

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
