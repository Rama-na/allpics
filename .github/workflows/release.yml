name: Release builds

# Manual trigger: produces signed Android artifacts once the keystore
# secrets are configured. iOS archives require a macOS runner + certificates
# (see docs/DEPLOYMENT.md).
on:
  workflow_dispatch:

jobs:
  android:
    name: Android · appbundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore signing config
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/allpics-release.keystore
          echo "$KEY_PROPERTIES" > android/key.properties
      - name: Restore prod env
        env:
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          mkdir -p env
          echo "$PROD_ENV_JSON" > env/prod.json
      - run: flutter pub get
      - run: flutter build appbundle --release --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@v4
        with:
          name: allpics-appbundle
          path: app/build/app/outputs/bundle/release/app-release.aab
