name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Flutter · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build web (admin panel)
        run: flutter build web --release

  worker:
    name: Worker · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: Docker build
        run: docker build -t allpics-worker .

  database:
    name: Database · migrations + verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local stack & apply migrations
        run: supabase db start
        working-directory: supabase
      - name: Verify schema (RLS, policies, functions, seeds, buckets)
        run: |
          supabase db reset
          psql "$(supabase status --output json | jq -r '.DB_URL // .db_url')" \
            -v ON_ERROR_STOP=1 -f tests/verify_schema.sql
        working-directory: supabase
